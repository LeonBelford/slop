<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaaS-Agent</title>
<style>
:root{--bg:#0f1218;--panel:#171c26;--panel2:#1d2331;--line:#2a3245;--text:#e6e9f0;--mute:#8b94a8;--accent:#6c8cff;--ok:#38c98a;--warn:#f2b441;--bad:#f0616d}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 14px;border-radius:8px;transition:.15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.5}
aside{width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
aside header{padding:18px 18px 12px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
aside header span{background:linear-gradient(135deg,#6c8cff,#a46cff);-webkit-background-clip:text;color:transparent}
.side-actions{padding:0 14px 12px;display:flex;gap:8px}
.side-actions button{flex:1}
#plist{flex:1;overflow:auto;padding:4px 10px 14px}
.card{padding:12px 14px;border:1px solid transparent;border-radius:10px;cursor:pointer;margin-bottom:4px}
.card:hover{background:var(--panel2)}
.card.sel{background:var(--panel2);border-color:var(--accent)}
.card .n{font-weight:600;display:flex;align-items:center;gap:8px}
.card .s{color:var(--mute);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.dot.run{background:var(--ok);box-shadow:0 0 0 0 rgba(56,201,138,.6);animation:pulse 1.8s infinite}
.dot.stop{background:var(--warn)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(56,201,138,0)}100%{box-shadow:0 0 0 0 rgba(56,201,138,0)}}
main{flex:1;overflow:auto;padding:26px 34px 50px}
.empty{color:var(--mute);margin-top:15vh;text-align:center}
.empty h2{color:var(--text)}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.top h1{margin:0;font-size:26px}
.idea{color:var(--mute);margin-top:4px;max-width:640px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);vertical-align:middle}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:9px 16px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
table{width:100%;border-collapse:collapse}
th{color:var(--mute);font-weight:500;text-align:left;font-size:12.5px;padding:6px 8px}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
pre{background:#0a0d13;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:60vh;font-size:12.5px;line-height:1.45;margin:0;white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:10px;align-items:center}
.hint{color:var(--mute);font-size:13px;margin:6px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}aside{width:230px}}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(640px,92vw)}
dialog::backdrop{background:rgba(5,8,14,.7)}
dialog h3{margin:0 0 14px}
label{display:block;color:var(--mute);font-size:13px;margin:12px 0 5px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}.toast.err{border-color:var(--bad)}
.job{font-size:12.5px;color:var(--mute);padding:8px 14px;border:1px dashed var(--line);border-radius:10px;margin-bottom:6px}
</style>
</head>
<body>
<aside>
  <header>🤖 <span>SaaS-Agent</span></header>
  <div class="side-actions">
    <button class="primary" onclick="openNew()">+ Neue Idee</button>
    <button onclick="openMaster()" title="Globale Vorgaben für alle Projekte">Master-Prompt</button>
  </div>
  <div id="plist"></div>
</aside>
<main id="main"></main>

<dialog id="dNew">
  <h3>Neue Idee, neues Projekt</h3>
  <label>Idee in ein, zwei Sätzen</label>
  <textarea id="nIdea" rows="3" placeholder="z. B. Rechnungs-Tool für Freelancer mit PDF-Export"></textarea>
  <div class="grid2">
    <div><label>Projektname (optional)</label><input id="nName" placeholder="rechnungen"></div>
    <div><label>Technik</label><select id="nPreset"><option value="fastapi">Python / FastAPI</option><option value="minimal">Minimal (Python)</option></select></div>
  </div>
  <p class="hint">Der Agent schreibt zuerst Ziel und Start-Aufgaben (einige Minuten). Gestartet wird danach per Knopf.</p>
  <div class="row" style="justify-content:flex-end"><button onclick="dNew.close()">Abbrechen</button><button class="primary" onclick="createProject()">Anlegen</button></div>
</dialog>

<dialog id="dMaster">
  <h3>Master-Prompt</h3>
  <p class="hint">Gilt für <b>alle</b> Projekte und wird beim Start jeder Session (jedes „Starten“) übernommen. Liegt als <code>MASTER.md</code> im Hauptordner.</p>
  <textarea id="mText" rows="14"></textarea>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button onclick="dMaster.close()">Schließen</button><button class="primary" onclick="saveMaster()">Speichern</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sel=localStorage.getItem("sel")||null, tab="uebersicht", list={projects:[],init_jobs:[]}, detail=null, dirty=false;

async function api(path,body){
  const opt=body===undefined?{}:{method:"POST",headers:{"X-UI":"1","Content-Type":"application/json"},body:JSON.stringify(body)};
  const r=await fetch(path,opt); const j=await r.json().catch(()=>({error:"Ungültige Antwort"}));
  if(!r.ok) throw new Error(j.error||r.statusText); return j;
}
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className="toast on"+(err?" err":"");clearTimeout(t._h);t._h=setTimeout(()=>t.className="toast",3200)}
async function act(a,body,ok){try{await api(`/api/project/${sel}/${a}`,body||{});if(ok)toast(ok);await refresh(true)}catch(e){toast(e.message,true)}}

function statusOf(p){return p.running?(p.stopping?["stop","stoppt nach Aufgabe"]:["run","läuft"]):["","gestoppt"]}
function renderList(){
  const jobs=list.init_jobs.map(j=>`<div class="job">${j.running?"⏳ Wird angelegt":"⚠️ Fehlgeschlagen"}: <b>${esc(j.name)}</b><br><code>${esc((j.log||"").split("\n").slice(-2).join(" "))}</code></div>`).join("");
  $("#plist").innerHTML=jobs+(list.projects.map(p=>{const[c,t]=statusOf(p);
    return `<div class="card ${p.name===sel?"sel":""}" onclick="select('${esc(p.name)}')"><div class="n"><span class="dot ${c}"></span>${esc(p.name)}</div><div class="s">${t} · ${p.merged} Features · ${p.backlog.pending||0} offen</div></div>`}).join("")||(jobs?"":'<div class="hint" style="padding:10px">Noch keine Projekte.</div>'));
}
function select(n){sel=n;localStorage.setItem("sel",n);tab="uebersicht";dirty=false;detail=null;$("#main").dataset.tab="";renderList();refresh(true)}

function renderMain(){
  const m=$("#main");
  if(!sel){m.innerHTML=`<div class="empty"><h2>Willkommen 👋</h2><p>Wähle links ein Projekt oder lege mit <b>+ Neue Idee</b> ein neues an.</p></div>`;return}
  if(!detail)return;
  const d=detail,[c,t]=statusOf(d);
  const el=document.activeElement, typing=el&&["INPUT","TEXTAREA","SELECT"].includes(el.tagName)&&m.contains(el);
  // Eingaben nicht durch das automatische Aktualisieren überschreiben
  if(tab==="ideen"&&m.dataset.name===sel&&m.dataset.tab===tab&&(typing||dirty))return;
  m.dataset.name=sel;m.dataset.tab=tab;
  const pillF=d.failures?`<span class="pill bad">${d.failures} Fehler in Folge</span>`:"";
  const head=`<div class="top"><div><h1>${esc(d.name)} <span class="pill ${c==="run"?"ok":c==="stop"?"warn":""}">${t}</span> ${pillF}</h1><div class="idea">${esc(d.idea)}</div></div>
  <div class="btns">
    ${d.running?`<button class="danger" onclick="act('stop',{},'Stopp nach der aktuellen Aufgabe')" ${d.stopping?"disabled":""}>■ Stoppen</button>`:`<button class="primary" onclick="act('start',{},'Agent gestartet')">▶ Starten</button>`}
    <button onclick="doTry()" ${d.try_running?"disabled":""}>🧪 ${d.try_running?"Baue Testversion …":"Jetzt testen"}</button>
  </div></div>
  <div class="stats">
    <div class="stat"><b>${d.merged}</b><span>Features gemerged</span></div>
    <div class="stat"><b>${d.backlog.pending||0}</b><span>offene Aufgaben</span></div>
    <div class="stat"><b>${d.backlog.done||0}</b><span>erledigt</span></div>
    <div class="stat"><b>${d.backlog.blocked||0}</b><span>blockiert</span></div>
    <div class="stat"><b>${d.iteration}</b><span>Iterationen</span></div>
    <div class="stat"><b>${d.hours} h</b><span>Laufzeit</span></div>
  </div>
  <div class="tabs">${[["uebersicht","Übersicht"],["ideen","Ideen & Feedback"],["testen","Testversion"],["log","Live-Log"],["ziel","Ziel"]].map(([k,l])=>`<div class="tab ${tab===k?"on":""}" onclick="setTab('${k}')">${l}</div>`).join("")}</div>`;
  let body="";
  if(tab==="uebersicht"){
    const rows=d.backlog_items.map(i=>`<tr><td>${esc(i.id)}</td><td>${esc(i.title)}${i.source==="ideas"?' <span class="pill ok">von dir</span>':""}</td><td>${esc(i.type)}</td><td>${Math.round(i.priority*10)/10}</td><td><span class="pill ${i.status==="done"?"ok":i.status==="blocked"?"bad":""}">${esc(i.status)}</span></td></tr>`).join("");
    body=`<div class="grid2"><div class="panel"><h3 style="margin-top:0">Backlog</h3><table><tr><th>ID</th><th>Aufgabe</th><th>Typ</th><th>Prio</th><th>Status</th></tr>${rows||'<tr><td colspan=5 class="hint">leer</td></tr>'}</table></div>
    <div class="panel"><h3 style="margin-top:0">Fertige Features</h3>${d.features.length?d.features.map(f=>`<div style="padding:5px 0;border-top:1px solid var(--line)">✅ ${esc(f.title)}</div>`).join(""):'<div class="hint">Noch keine.</div>'}</div></div>`;
  }else if(tab==="ideen"){
    body=`<div class="panel"><h3 style="margin-top:0">Schnelles Feedback</h3><p class="hint">Fehler oder Wunsch in einem Satz. Der Agent plant beim nächsten Durchlauf neu.</p>
    <div class="row"><input id="say" placeholder="z. B. Der Speichern-Button reagiert nicht" onkeydown="if(event.key==='Enter')say()"><button class="primary" onclick="say()">Senden</button></div></div>
    <div class="panel" style="margin-top:16px"><h3 style="margin-top:0">IDEAS.md – deine Vorgaben</h3><p class="hint">Wünsche, Umsetzungshinweise, Umbauten, „Nicht tun“. Wird laufend gelesen, auch während der Agent arbeitet.</p>
    <textarea id="ideas" rows="18" oninput="dirty=true">${esc(d.ideas)}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" onclick="saveIdeas()">Speichern</button></div></div>`;
  }else if(tab==="testen"){
    body=`<div class="panel"><p class="hint">„Jetzt testen“ lässt den Agenten die aktuelle Aufgabe beenden, baut den letzten funktionierenden Stand und zeigt hier, wie du ihn startest. Danach mit „Starten“ weiterarbeiten lassen.</p>
    ${d.testen?`<pre>${esc(d.testen)}</pre>`:'<div class="hint">Noch keine Testversion gebaut.</div>'}${d.try_running||d.try_out?`<h4>Ausgabe</h4><pre>${esc(d.try_out)}</pre>`:""}</div>`;
  }else if(tab==="log"){
    body=`<pre id="logbox">${esc(d.log||"Noch kein Log.")}${d.run_out&&/Traceback|Error/.test(d.run_out)?"\n\n--- run.out ---\n"+esc(d.run_out):""}</pre>`;
  }else{
    body=`<pre>${esc(d.goal||"")}</pre>`;
  }
  const keep=m.scrollTop;
  m.innerHTML=head+body;
  m.scrollTop=keep;
  const lb=$("#logbox"); if(lb) lb.scrollTop=lb.scrollHeight;
}
function setTab(k){tab=k;dirty=false;$("#main").dataset.tab="";renderMain()}
async function doTry(){await act("try",{},"Testversion wird gebaut, sobald die Aufgabe fertig ist");setTab("testen")}
async function say(){const v=$("#say").value.trim();if(!v)return;try{await api(`/api/project/${sel}/say`,{msg:v});toast("Feedback eingetragen");$("#say").value="";dirty=false;await refresh(true)}catch(e){toast(e.message,true)}}
async function saveIdeas(){try{await api(`/api/project/${sel}/ideas`,{text:$("#ideas").value});dirty=false;toast("IDEAS.md gespeichert");await refresh(true)}catch(e){toast(e.message,true)}}

function openNew(){$("#nIdea").value="";$("#nName").value="";dNew.showModal()}
async function createProject(){
  try{const r=await api("/api/projects",{idea:$("#nIdea").value,name:$("#nName").value,preset:$("#nPreset").value});dNew.close();toast("Projekt „"+r.name+"“ wird angelegt …");await refresh()}catch(e){toast(e.message,true)}
}
async function openMaster(){try{$("#mText").value=(await api("/api/master")).text;dMaster.showModal()}catch(e){toast(e.message,true)}}
async function saveMaster(){try{await api("/api/master",{text:$("#mText").value});toast("Master-Prompt gespeichert (gilt ab dem nächsten Start)");dMaster.close()}catch(e){toast(e.message,true)}}

async function refresh(force){
  try{
    list=await api("/api/projects");
    if(!sel||!list.projects.some(p=>p.name===sel))sel=list.projects[0]?.name||null;
    renderList();
    if(sel){detail=await api("/api/project/"+encodeURIComponent(sel));if(force)$("#main").dataset.tab=""}
    renderMain();
  }catch(e){}
}
refresh(true); setInterval(refresh,3000);
</script>
</body>
</html>
